# Your own server and media. No PRISM account or author's server is used.
services:
  jellyfin:
    image: jellyfin/jellyfin:12.1
    environment:
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ./config:/config
      - ./cache:/cache
      - ${MEDIA_PATH:-./media}:/media:ro
    ports:
      - "${PRISM_BIND_ADDRESS:-127.0.0.1}:8096:8096/tcp"
    restart: unless-stopped

  # Optional. Enable with: docker compose --profile artwork up -d --build
  artwork:
    profiles: [artwork]
    build: ./artwork-service
    depends_on:
      - jellyfin
    environment:
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_HOME_VIDEOS_PATH=${JELLYFIN_HOME_VIDEOS_PATH:-/media/Home Videos}
      - ARTWORK_ROOT=/home-videos
      - ALLOWED_ORIGINS=null,file://,http://localhost:5173,http://127.0.0.1:5173
    user: "${ARTWORK_UID:-1000}:${ARTWORK_GID:-1000}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ${HOME_VIDEOS_PATH:-./media/Home Videos}:/home-videos:rw
    ports:
      - "${PRISM_BIND_ADDRESS:-127.0.0.1}:8097:8097/tcp"
    restart: unless-stopped
