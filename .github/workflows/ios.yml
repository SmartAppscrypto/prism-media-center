name: Native iOS SDK validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Require Duo SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iphonesimulator27\.[1-9]' || { echo 'Xcode 27.1 SDK required; no fallback can validate Duo APIs.'; exit 1; }
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - run: xcodebuild -project Prism.xcodeproj -scheme Prism -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
        working-directory: ios
