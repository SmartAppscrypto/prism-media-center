name: Apple platform validation
on:
  workflow_dispatch:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  apple:
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: Prism
            sdk: iphonesimulator
            xcode: '27.0'
            flags: ''
          - scheme: Prism
            sdk: iphonesimulator
            xcode: '27.1_beta'
            flags: PRISM_DUO_SDK
          - scheme: PrismTV
            sdk: appletvsimulator
            xcode: '27.0'
            flags: ''
          - scheme: PrismMac
            sdk: macosx
            xcode: '27.0'
            flags: ''
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Inspect selected SDK
        run: xcodebuild -version && xcodebuild -showsdks
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - name: Build Apple client
        working-directory: ios
        run: >-
          xcodebuild -project Prism.xcodeproj -scheme '${{ matrix.scheme }}'
          -sdk '${{ matrix.sdk }}' -configuration Release
          -derivedDataPath .build/${{ matrix.scheme }}
          CODE_SIGNING_ALLOWED=NO
          SWIFT_ACTIVE_COMPILATION_CONDITIONS='${{ matrix.flags }}'
          build
      - name: Test layout and address boundaries
        if: matrix.scheme == 'PrismMac'
        working-directory: ios
        run: xcodebuild -project Prism.xcodeproj -scheme PrismMac -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test
      - name: Package unsigned validation app
        if: matrix.scheme == 'PrismMac'
        run: ditto -c -k --keepParent ios/.build/PrismMac/Build/Products/Release/PrismMac.app PrismMac-validation.zip
      - uses: actions/upload-artifact@v4
        if: matrix.scheme == 'PrismMac'
        with:
          name: PrismMac-validation
          path: PrismMac-validation.zip
          retention-days: 7
