name: Desktop release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --draft --prerelease --title "PRISM $GITHUB_REF_NAME - desktop preview" --notes-file docs/RELEASE-NOTES.md
  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            vlc_arch: arm64
            platform: mac
          - runner: macos-15-intel
            arch: x64
            vlc_arch: intel64
            platform: mac
          - runner: windows-latest
            arch: x64
            platform: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      npm_config_arch: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:security
      - run: npm audit --audit-level=moderate
      - name: Prepare verified VLC on Mac
        if: matrix.platform == 'mac'
        env:
          VLC_ARCH: ${{ matrix.vlc_arch }}
        run: |
          cd "$RUNNER_TEMP"
          file="vlc-3.0.24-${VLC_ARCH}.dmg"
          base="https://download.videolan.org/pub/videolan/vlc/3.0.24/macosx"
          curl --fail --location --retry 3 "$base/$file" -o "$file"
          curl --fail --location --retry 3 "$base/$file.sha256" -o "$file.sha256"
          shasum -a 256 -c "$file.sha256"
          hdiutil attach "$file" -nobrowse -mountpoint "$RUNNER_TEMP/vlc-mount"
          sudo ditto "$RUNNER_TEMP/vlc-mount/VLC.app" /Applications/VLC.app
          hdiutil detach "$RUNNER_TEMP/vlc-mount"
      - name: Prepare verified VLC on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $file = "vlc-3.0.24-win64.zip"
          $base = "https://download.videolan.org/pub/videolan/vlc/3.0.24/win64"
          $archive = Join-Path $env:RUNNER_TEMP $file
          Invoke-WebRequest "$base/$file" -OutFile $archive
          Invoke-WebRequest "$base/$file.sha256" -OutFile "$archive.sha256"
          $expected = ((Get-Content "$archive.sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected) { throw 'VLC checksum mismatch' }
          $runtime = Join-Path $env:RUNNER_TEMP 'vlc-runtime'
          Expand-Archive $archive -DestinationPath $runtime
          "PRISM_VLC_DIR=$runtime\vlc-3.0.24" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: npm run package:${{ matrix.platform }}
      - name: Attach installer to draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(desktop/release/*.dmg desktop/release/*Setup.exe)
          test "${#files[@]}" -gt 0
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: Prism-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/release/*.dmg
            desktop/release/*Setup.exe
          if-no-files-found: error
  server-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start a clean independent server
        working-directory: server
        run: |
          mkdir -p config cache media/Movies
          docker compose config --quiet
          docker compose up -d jellyfin
          for attempt in $(seq 1 90); do
            if curl --fail http://127.0.0.1:8096/System/Info/Public -o /tmp/server-info.json; then
              node --experimental-strip-types ../scripts/server-smoke.mjs
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - if: always()
        working-directory: server
        run: docker compose down
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, server-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download verified installers from draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --dir release
      - name: Package server, guide and source notices
        run: |
          cp docs/GETTING-STARTED.md server/READ-ME-FIRST.md
          zip -r release/Prism-Server-Starter.zip server -x 'server/.env' 'server/config/*' 'server/cache/*' 'server/media/*'
          cp output/pdf/PRISM-Getting-Started.pdf release/
          cp desktop/legal/THIRD-PARTY-NOTICES.md release/
          curl --fail --location --retry 3 https://download.videolan.org/pub/videolan/vlc/3.0.24/vlc-3.0.24.tar.xz -o release/vlc-3.0.24.tar.xz
          curl --fail --location https://download.videolan.org/pub/videolan/vlc/3.0.24/vlc-3.0.24.tar.xz.sha256 -o release/vlc-3.0.24.tar.xz.sha256
          cd release
          sha256sum -c vlc-3.0.24.tar.xz.sha256
          rm vlc-3.0.24.tar.xz.sha256
          sha256sum * > SHA256SUMS.txt
      - name: Publish preview installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
